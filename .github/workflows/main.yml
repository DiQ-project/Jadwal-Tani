name: Build Jadwal Tani Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode project
        uses: actions/checkout@v6

      - name: Siapkan Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Siapkan Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install
          npm install -D typescript

      - name: Siapkan folder web
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/

          if [ -f manifest.webmanifest ]; then
            cp manifest.webmanifest www/
          fi

          if [ -f manifest.json ]; then
            cp manifest.json www/
          fi

          if [ -f service-worker.js ]; then
            cp service-worker.js www/
          fi

          if [ -f sw.js ]; then
            cp sw.js www/
          fi

          if [ -d icons ]; then
            cp -r icons www/
          fi

      - name: Bundle notifikasi native
        run: |
          npx esbuild capacitor-notifications.js \
            --bundle \
            --platform=browser \
            --format=iife \
            --outfile=www/capacitor-notifications.js

      - name: Buat project Android Capacitor
        run: npx cap add android

      - name: Pasang ikon Jadwal Tani
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          cp icons/icon-192.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp icons/icon-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icons/icon-192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icons/icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icons/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp icons/icon-192.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp icons/icon-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp icons/icon-192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp icons/icon-512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp icons/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Sinkronkan Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Jadwal-Tani-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
